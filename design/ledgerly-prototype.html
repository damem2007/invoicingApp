<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ledgerly prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f9;--card:#fff;--ink:#1d1b2b;--mut:#6f6c80;--line:#e8e6ef;--pri:#5b46c4;--btn:#5b46c4;--pri2:#ede9fb;--ok:#1f7a52;--okb:#e2f4ec;--warn:#a5501a;--warnb:#fdeedd;--bad:#b8323f;--badb:#fbe5e8;--info:#2f5fae;--infob:#e5eefb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131c;--card:#1d1b29;--ink:#efedf8;--mut:#a09db2;--line:#2e2b3d;--pri:#a897f7;--pri2:#2b2646;--okb:#173a2c;--warnb:#3d2a17;--badb:#401e25;--infb:#1c2c47;--infob:#1c2c47;--ok:#5fd0a0;--warn:#f0a56a;--bad:#f2808d;--info:#86adf0}}
:root[data-theme="dark"]{--bg:#14131c;--card:#1d1b29;--ink:#efedf8;--mut:#a09db2;--line:#2e2b3d;--pri:#a897f7;--pri2:#2b2646;--okb:#173a2c;--warnb:#3d2a17;--badb:#401e25;--infob:#1c2c47;--ok:#5fd0a0;--warn:#f0a56a;--bad:#f2808d;--info:#86adf0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0}h1{font:700 34px/1.1 "Playfair Display",Georgia,serif;letter-spacing:-.01em}h2{font-size:17px}h3{font-size:15px}
.app{display:flex;min-height:100vh}aside{width:232px;padding:22px 14px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font:700 24px "Playfair Display",serif;padding:0 8px 18px}.logo i{width:30px;height:30px;border-radius:9px;background:var(--btn);display:grid;place-items:center}.logo svg{width:17px;stroke:#fff}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500;cursor:pointer}nav a svg{width:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a.on{background:var(--pri2);color:var(--pri);font-weight:700}nav a:hover:not(.on){background:var(--bg)}.bd{margin-left:auto;background:var(--badb);color:var(--bad);font-size:12px;font-weight:700;border-radius:99px;padding:0 8px}
.sp{flex:1}.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut)}
main{flex:1;min-width:0;padding:34px 40px 60px;max-width:1180px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}.hd p{margin:6px 0 0;color:var(--mut)}
.btn{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}.btn:hover{filter:brightness(1.1)}.btn.s{background:var(--card);color:var(--pri);border:1px solid var(--line)}.btn.sm{padding:6px 12px;font-size:13px}.btn[disabled]{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 340px;align-items:start}
.kpi{cursor:pointer;text-align:left;transition:border-color .15s}.kpi:hover{border-color:var(--pri)}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:30px;margin-top:4px}
table{width:100%;border-collapse:collapse}th{font-weight:500;color:var(--mut);font-size:13px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}.r{text-align:right}.mut{color:var(--mut)}
.tbw{overflow-x:auto}.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.Paid,.Active,.Connected{background:var(--okb);color:var(--ok)}.Sent,.Recurring{background:var(--infob);color:var(--info)}.Overdue,.Attention{background:var(--badb);color:var(--bad)}.Draft,.Paused,.Off{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mut);font-weight:500;white-space:nowrap}.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.row{display:flex;gap:12px;align-items:center}.row.b{justify-content:space-between}input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}textarea{resize:vertical;min-height:70px}
.fl{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}.search{max-width:280px}
details{position:relative}summary{list-style:none;cursor:pointer;padding:4px 10px;border-radius:8px;color:var(--mut);display:inline-block}summary::-webkit-details-marker{display:none}summary:hover{background:var(--bg)}
.menu{position:absolute;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.15)}.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}.menu button:hover{background:var(--pri2)}.menu .d{color:var(--bad)}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.int{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.int:last-child{border:0;padding-bottom:0}.int>div:nth-child(2){flex:1;min-width:0}
.ov{position:fixed;inset:0;background:rgba(15,10,30,.45);z-index:20;display:flex;justify-content:flex-end}.ov.c{justify-content:center;align-items:center}
.dr{background:var(--card);width:min(460px,100%);height:100%;padding:24px;overflow:auto;display:flex;flex-direction:column;animation:sl .22s ease-out}@keyframes sl{from{transform:translateX(40px);opacity:0}}
.md{background:var(--card);border-radius:16px;padding:24px;width:min(420px,92%)}
.stp{display:flex;gap:6px;margin:16px 0 8px}.stp div{flex:1;height:4px;border-radius:9px;background:var(--line)}.stp .a{background:var(--btn)}
.tg{display:flex;align-items:center;gap:10px;margin-top:12px}.tg input{width:auto}code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:block;font-size:13px;word-break:break-all}
.err{color:var(--bad);font-size:13px;margin-top:6px}.ok{color:var(--ok)}.ed{max-width:760px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px}.chips .on{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
.tot div{display:flex;justify-content:space-between;padding:6px 0}.tot .big{font:700 22px "Playfair Display",serif;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--pri)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;z-index:30;display:flex;gap:14px}.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:900px){.k4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:760px){aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;border:0;border-top:1px solid var(--line)}.logo,.sp,.ghost{display:none}nav{display:flex;width:100%;justify-content:space-around}nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}.bd{display:none}main{padding:22px 16px 100px}h1{font-size:28px}.int{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div>
<script>
const T="2026-10-28",$=s=>document.querySelector(s),SYM={USD:"$",CAD:"CA$",EUR:"€"},CN={USD:"US dollar",CAD:"Canadian dollar",EUR:"Euro"};
const U=s=>new Date(s+"T00:00:00Z"),iso=d=>d.toISOString().slice(0,10);
const D=s=>U(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
const addD=(s,n)=>{const d=U(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const addM=(s,n)=>{const d=U(s),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const l=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,l));return iso(d)};
const stepF=(s,f,k)=>({Weekly:()=>addD(s,7*k),Biweekly:()=>addD(s,14*k),Monthly:()=>addM(s,k),Quarterly:()=>addM(s,3*k),Yearly:()=>addM(s,12*k)})[f]();
const M=n=>(S.ed?SYM[S.ed.cur]:"$")+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const S={r:"overview",tab:"All",q:"",cs:["Wealth & Estate Financial Canada Inc (WEFCI)","Northwind Studio","Alder & Finch LLP"],cd:[{e:"info@wefci.com",p:"+1 (905) 232-9332",a:"100 King St W, Suite 400\nToronto, ON M5X 1A9"},{e:"accounts@northwind.studio",p:"+1 (604) 555-0142",a:"88 Powell St\nVancouver, BC V6A 1G1"},{e:"ap@alderfinch.com",p:"+1 (403) 555-0199",a:"410 8 Ave SW\nCalgary, AB T2P 1E3"}],biz:[{n:"Harbour Lane Studio",a:"120 Water St\nVancouver, BC V6B 1A4",e:"billing@harbourlane.ca",p:"+1 (604) 555-0110"},{n:"Harbour Lane Consulting",a:"22 Granville St\nVancouver, BC V6C 1S4",e:"hello@harbourlane.co",p:"+1 (604) 555-0177"}],
inv:[{id:"INV-0001",c:0,a:2400,due:"2026-10-05",s:"Paid",rec:1},{id:"INV-0002",c:1,a:1800,due:"2026-11-12",s:"Sent"},{id:"INV-0003",c:2,a:950,due:"2026-10-15",s:"Sent"},{id:"INV-0004",c:0,a:600,due:"2026-11-20",s:"Draft"}],
pay:[{d:"2026-10-04",inv:"INV-0001",c:0,m:"Stripe",a:2400}],
rec:[{c:0,a:2400,f:"Monthly",next:"2026-11-01",st:"Active",auto:1}],
ints:{gmail:{on:1,acct:"billing@harbourlane.ca"},outlook:{},stripe:{},qb:{}},w:null,m:null,t:null,ed:null,menu:0,dcur:"USD"};
const P={gmail:["Google Gmail","Email delivery","G","#d44638"],outlook:["Microsoft Outlook","Email delivery","O","#1670c4"],stripe:["Stripe","Online payments","S","#635bff"],qb:["QuickBooks","Accounting sync","QB","#2c9f3c"]};
const IC={overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',invoices:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>',clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.500 20c.5-4 3-6 6.500-6s6 2 6.500 6"/><path d="M16 5a3.500 3.500 0 010 7"/>',payments:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>',integrations:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const st=i=>i.s==="Sent"&&i.due<T?"Overdue":i.s,pl=(t,c)=>`<span class="pill ${c||t}">${t}</span>`;
const sum=f=>S.inv.filter(f).reduce((a,i)=>a+i.a,0);
const go=(r,t)=>{S.r=r;if(t)S.tab=t;S.q="";S.menu=0;S.ed=null;render();scrollTo(0,0)};
const toast=(m,u)=>{S.t={m,u};render();clearTimeout(S.tt);S.tt=setTimeout(()=>{S.t=null;render()},5000)};
const isMail=()=>S.ints.gmail.on||S.ints.outlook.on;

function shell(b){const od=S.inv.filter(i=>st(i)==="Overdue").length;
const n=(k,l)=>`<a class="${S.r===k?"on":""}" onclick="go('${k}')" tabindex="0" onkeydown="if(event.key==='Enter')go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}${k==="invoices"&&od?`<span class="bd">${od}</span>`:""}</a>`;
return `<div class="app"><aside><div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/></svg></i>ledgerly</div><nav>${n("overview","Overview")}${n("invoices","Invoices")}${n("clients","Clients")}${n("payments","Payments")}${n("integrations","Integrations")}${n("settings","Settings")}</nav><div class="sp"></div><button class="ghost" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Toggle dark mode</button></aside><main>${b}</main></div>`}
const hdr=(t,sub,act)=>`<div class="hd"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:""}</div>${act===undefined?`<button class="btn" onclick="newInv()">+ New invoice</button>`:act}</div>`;
const ib=p=>`<div class="ib" style="background:${P[p][3]}">${P[p][2]}</div>`;
function intRow(p,big){const i=S.ints[p],on=i.on;
return `<div class="int">${ib(p)}<div><b>${P[p][0]}</b><div class="mut" style="font-size:13px">${on?i.acct:big?P[p][1]+" · not connected":"Not connected"}</div></div>${pl(on?"Connected":"Off","")}${on&&big?`<button class="btn s sm" onclick="wiz('${p}',1)">Configure</button><button class="btn s sm" onclick="disc('${p}')">Disconnect</button>`:`<button class="btn ${on?"s":""} sm" onclick="wiz('${p}')">${on?"Manage":"Connect"}</button>`}</div>`}

function overview(){const out=sum(i=>["Sent","Overdue"].includes(st(i))),k=(l,v,t)=>`<button class="card kpi" onclick="go('invoices','${t}')"><small>${l}</small><b>${v}</b></button>`;
const bad=S.inv.filter(i=>st(i)==="Overdue");
return hdr("Overview","Good morning. Here is where your invoices stand.")+`<div class="grid k4">${k("Outstanding",M(out),"Sent")}${k("Paid",M(sum(i=>i.s==="Paid")),"Paid")}${k("Overdue",M(sum(i=>st(i)==="Overdue")),"Overdue")}${k("Total invoices",S.inv.length,"All")}</div>
<div class="grid two" style="margin-top:16px"><div class="grid">${bad.length?`<div class="card" style="border-color:var(--bad)"><h2>Needs attention</h2>${bad.map(i=>`<div class="row b" style="margin-top:12px"><span><b>${i.id}</b> · ${S.cs[i.c].split(" (")[0]} is overdue since ${D(i.due)}</span><button class="btn sm" onclick="send('${i.id}')">Send reminder</button></div>`).join("")}</div>`:""}
<div class="card"><div class="row b"><h2>Recent invoices</h2><a class="mut" style="cursor:pointer" onclick="go('invoices')">View all</a></div><div class="tbw"><table>${S.inv.slice(-5).reverse().map(i=>`<tr><td><b>${i.id}</b> ${i.rec?pl("Recurring"):""}<br><span class="mut">${S.cs[i.c].split(" (")[0]}</span></td><td>${pl(st(i))}</td><td class="r">${M(i.a)}</td></tr>`).join("")}</table></div></div></div>
<div class="grid"><div class="card"><h2>Upcoming recurring</h2>${S.rec.filter(r=>r.st==="Active").map(r=>`<div class="row b" style="margin-top:12px"><span>${S.cs[r.c].split(" (")[0]}<br><span class="mut">${r.f} · ${D(r.next)}</span></span><b>${M(r.a)}</b></div>`).join("")||`<p class="mut">Nothing scheduled. Turn on Repeat when you create an invoice.</p>`}</div>
<div class="card"><div class="row b"><h2>Integrations</h2><a class="mut" style="cursor:pointer" onclick="go('integrations')">Manage</a></div>${Object.keys(P).map(p=>intRow(p)).join("")}</div></div></div>`}

function tbl(){const q=S.q.toLowerCase();
if(S.tab==="Recurring")return `<div style="padding:6px 0 12px"><button class="btn sm" onclick="svNew()">+ Set up recurring service</button></div><table><tr><th>Client</th><th>Frequency</th><th>Next run</th><th>Status</th><th class="r">Amount</th><th></th></tr>${S.rec.map((r,x)=>`<tr><td><b>${S.cs[r.c].split(" (")[0]}</b><br><span class="mut">${r.auto?"Sends automatically":"Creates drafts"}${r.src?", based on "+r.src:""}</span></td><td>${r.f}</td><td>${r.st==="Active"?D(r.next):"—"}</td><td>${pl(r.st)}</td><td class="r">${M(r.a)}${r.chg?`<br><span class="mut" style="font-size:12px">${M(r.chg.a)} from ${D(r.chg.from)}</span>`:r.prev?`<br><span class="mut" style="font-size:12px">was ${M(r.prev)}</span>`:""}</td><td class="r"><button class="btn s sm" onclick="runRec(${x})">Run now</button> <button class="btn s sm" onclick="S.cr=${x};S.m='chg';render()">Change price</button> <button class="btn s sm" onclick="S.rec[${x}].st=S.rec[${x}].st==='Active'?'Paused':'Active';render()">${r.st==="Active"?"Pause":"Resume"}</button></td></tr>`).join("")}</table>`;
const l=S.inv.map(i=>({...i,x:st(i)})).filter(i=>(S.tab==="All"||i.x===S.tab||(S.tab==="Sent"&&i.x==="Sent"))&&(S.cs[i.c]+i.id).toLowerCase().includes(q)).reverse();
if(!l.length)return `<div style="text-align:center;padding:40px" class="mut">No invoices match. <a style="color:var(--pri);cursor:pointer" onclick="newInv()">Create an invoice</a></div>`;
return `<table><tr><th>Invoice</th><th>Client</th><th>Due</th><th>Status</th><th class="r">Amount</th><th></th></tr>${l.map(i=>`<tr><td><b>${i.id}</b> ${i.rec?pl("Recurring"):""}${i.old?pl("Past invoice","Draft"):""}</td><td>${S.cs[i.c].split(" (")[0]}</td><td>${D(i.due)}</td><td>${pl(i.x)}</td><td class="r">${M(i.a)}</td><td class="r"><details><summary>⋯</summary><div class="menu">${i.s!=="Paid"?`<button onclick="markPaid('${i.id}')">Mark paid</button><button onclick="send('${i.id}')">Send</button>`:""}<button onclick="toast('PDF downloaded')">Download PDF</button>${!i.rec?`<button onclick="S.mr='${i.id}';S.m='mkrec';render()">Make recurring</button>`:""}<button onclick="dup('${i.id}')">Duplicate</button><button class="d" onclick="del('${i.id}')">Delete</button></div></details></td></tr>`).join("")}</table>`}
function invoices(){const c=t=>t==="All"?S.inv.length:t==="Recurring"?S.rec.length:S.inv.filter(i=>st(i)===t).length;
return hdr("Invoices","Search, filter and act on every invoice.",`<div class="row"><button class="btn s" onclick="S.pc=undefined;S.m='past';render()">Add past invoice</button><button class="btn" onclick="newInv()">+ New invoice</button></div>`)+`<div class="card"><div class="row b" style="flex-wrap:wrap"><div class="tabs" style="flex:1;border:0;margin:0">${["All","Draft","Sent","Paid","Overdue","Recurring"].map(t=>`<button class="${S.tab===t?"on":""}" onclick="S.tab='${t}';render()">${t} ${c(t)}</button>`).join("")}</div><input class="search" placeholder="Search invoices" value="${S.q}" oninput="S.q=this.value;$('#tbl').innerHTML=tbl()"></div><div class="tbw" id="tbl" style="min-height:200px">${tbl()}</div></div>`}

function clients(){return hdr("Clients",S.cs.length+(S.cs.length===1?" saved client":" saved clients"),`<button class="btn" onclick="S.m='client';render()">+ New client</button>`)+`<div class="card tbw"><table><tr><th>Client</th><th>Contact</th><th>Invoices</th><th class="r">Total billed</th><th></th></tr>${S.cs.map((n,x)=>{const l=S.inv.filter(i=>i.c===x);return `<tr><td><b>${n}</b></td><td class="mut">${[S.cd[x].e,S.cd[x].p].filter(Boolean).join(" · ")||"—"}</td><td>${l.length}</td><td class="r">${M(l.reduce((a,i)=>a+i.a,0))}</td><td class="r"><button class="btn s sm" onclick="S.pc=${x};S.m='past';render()">Add past invoice</button> <button class="btn sm" onclick="svNew(${x})">Recurring service</button></td></tr>`}).join("")}</table></div>`}
function payments(){return hdr("Payments","Every payment, matched to its invoice.",`<button class="btn" onclick="S.m='pay';render()">Record payment</button>`)+`<div class="card tbw"><table><tr><th>Date</th><th>Invoice</th><th>Client</th><th>Source</th><th class="r">Amount</th></tr>${S.pay.map(p=>`<tr><td>${D(p.d)}</td><td><b>${p.inv}</b></td><td>${S.cs[p.c].split(" (")[0]}</td><td>${pl(p.m,"Sent")}</td><td class="r">${M(p.a)}</td></tr>`).join("")||`<tr><td class="mut">No payments yet.</td></tr>`}</table></div>`}
